<!-- MODAL: RETURN INSPECTION MODAL -->
  <div id="modal-return-inspect" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white p-5 md:p-6 rounded-2xl shadow-xl w-full max-w-md space-y-4">
      <h3 class="text-lg font-bold text-slate-800 border-b pb-2 flex items-center gap-2">🔍 <span data-i18n="inspectTitle">ตรวจสอบสภาพอุปกรณ์ก่อนรับคืน</span></h3>
      
      <div>
        <p class="text-xs text-slate-500 mb-1" data-i18n="inspectEqLbl">อุปกรณ์ที่จะรับคืน:</p>
        <p id="inspect-equipment-name" class="font-bold text-indigo-900 text-sm md:text-base bg-indigo-50 p-2.5 rounded-xl border border-indigo-100">-</p>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1" data-i18n="inspectCondLbl">🟢 สภาพอุปกรณ์เมื่อส่งคืน *</label>
        <select id="inspect-condition" class="w-full p-3 border border-slate-200 rounded-xl text-sm font-bold bg-slate-50 outline-none">
          <option value="GOOD" data-i18n="optGood">🟢 สมบูรณ์พร้อมใช้งานปกติ (Good Condition)</option>
          <option value="MINOR_DAMAGE" data-i18n="optMinorDamage">🟡 ชำรุดเล็กน้อย / ต้องซ่อมบำรุง (Minor Damage)</option>
          <option value="DAMAGED_LOST" data-i18n="optDamagedLost">🔴 ชำรุดหนัก / อุปกรณ์สูญหาย (Damaged / Lost)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1" data-i18n="inspectRemarkLbl">📝 หมายเหตุการตรวจรับคืน / บันทึกอาการชำรุด</label>
        <textarea id="inspect-remark" rows="2" placeholder="เช่น รอยขีดข่วนที่หน้าจอ, สายสัญญาณขาด" class="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none"></textarea>
      </div>

      <div class="flex flex-col sm:flex-row justify-end gap-2 pt-4 border-t border-slate-100">
        <button onclick="confirmReturnWithInspection()" class="w-full sm:w-auto px-5 py-2.5 text-sm font-bold bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl shadow order-1 sm:order-2">↩️ <span data-i18n="btnConfirmReturn">ยืนยันการรับคืนอุปกรณ์</span></button>
        <button onclick="closeModals()" class="w-full sm:w-auto px-4 py-2.5 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl order-2 sm:order-1" data-i18n="btnCancelModal">ยกเลิก</button>
      </div>
    </div>
  </div>

  <!-- MODAL: EVENT DETAILS -->
  <div id="modal-event-detail" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white p-5 md:p-6 rounded-3xl shadow-2xl w-full max-w-2xl space-y-4 max-h-[90vh] flex flex-col">
      
      <!-- Modal Header -->
      <div class="flex justify-between items-start border-b border-slate-100 pb-3 flex-shrink-0">
        <div>
          <span id="detail-dept-badge" class="px-3 py-1 rounded-full text-[10px] md:text-xs font-extrabold bg-indigo-100 text-indigo-800 tracking-wide">ฝ่าย -</span>
          <h3 id="detail-title" class="text-lg md:text-xl font-bold text-slate-800 mt-2 leading-tight">ชื่อกิจกรรม</h3>
        </div>
        <button onclick="closeModals()" class="text-slate-400 hover:text-slate-600 font-bold text-2xl p-1 leading-none">✕</button>
      </div>

      <!-- Modal Body (Scrollable) -->
      <div class="overflow-y-auto pr-2 space-y-4 flex-1">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs md:text-sm text-slate-600">
          <p class="col-span-1 md:col-span-2 text-indigo-900 bg-indigo-50/80 p-3 rounded-xl border border-indigo-100">
            <b data-i18n="detailHost">👤 ผู้จัดงาน / ผู้รับผิดชอบหลัก:</b> 
            <span id="detail-main-host" class="font-bold text-sm md:text-base text-indigo-700 block mt-1">-</span>
          </p>
          <p class="bg-slate-50 p-3 rounded-xl border border-slate-100"><b data-i18n="detailLocation">📍 สถานที่:</b> <span id="detail-location" class="block mt-1 font-medium text-slate-800">-</span></p>
          <p class="col-span-1 md:col-span-2"><b data-i18n="detailOrganizer">🏷️ ทีมงานปฏิบัติงาน (Tagged):</b> <span id="detail-organizer" class="text-indigo-600 font-semibold block mt-1 bg-indigo-50/50 p-3 rounded-lg border border-indigo-100 leading-relaxed">-</span></p>
          <p class="bg-slate-50 p-3 rounded-xl border border-slate-100"><b data-i18n="detailStart">⏰ เวลาเริ่ม:</b> <span id="detail-start" class="font-bold text-slate-800 block mt-1">-</span></p>
          <p class="bg-slate-50 p-3 rounded-xl border border-slate-100"><b data-i18n="detailEnd">⏰ เวลาสิ้นสุด:</b> <span id="detail-end" class="font-bold text-slate-800 block mt-1">-</span></p>
          <p class="col-span-1 md:col-span-2 bg-amber-50 p-3 rounded-xl border border-amber-100"><b data-i18n="detailRemarks">📝 หมายเหตุ:</b> <span id="detail-remarks" class="text-slate-700 block mt-1">-</span></p>
        </div>

        <div class="border-t border-slate-100 pt-3">
          <h4 class="font-bold text-slate-800 text-sm mb-2" data-i18n="detailEqChecklist">🛠️ รายการอุปกรณ์จัดเตรียม & Checklist:</h4>
          <div id="detail-equipment-list" class="bg-slate-50 p-3 rounded-xl text-xs md:text-sm space-y-2 border border-slate-100"></div>
        </div>
      </div>

      <!-- Modal Footer (Responsive Buttons) -->
      <div class="flex flex-col md:flex-row justify-between items-center pt-4 border-t border-slate-100 gap-3 flex-shrink-0">
        
        <!-- Admin Buttons -->
        <div class="flex flex-col sm:flex-row gap-2 w-full md:w-auto order-2 md:order-1">
          <button id="btn-edit-event" onclick="editEventFromModal()" class="admin-col hidden w-full sm:w-auto px-4 py-3 md:py-2 text-sm font-bold bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-xl transition text-center justify-center items-center gap-1">
            ✏️ <span data-i18n="btnEditEventAdmin">แก้ไขงาน</span>
          </button>
          <button id="btn-cancel-event" onclick="cancelEvent()" class="admin-col hidden w-full sm:w-auto px-4 py-3 md:py-2 text-sm font-bold bg-rose-100 hover:bg-rose-200 text-rose-700 rounded-xl transition text-center justify-center items-center gap-1">
            🗑️ <span data-i18n="btnCancelEventAdmin">ยกเลิกงาน</span>
          </button>
        </div>

        <!-- Normal Buttons -->
        <div class="flex flex-col sm:flex-row gap-2 w-full md:w-auto order-1 md:order-2">
          <button onclick="printEventReport()" class="w-full sm:w-auto px-5 py-3 md:py-2 text-sm font-bold bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow flex justify-center items-center gap-2 order-1 sm:order-2">
            🖨️ <span data-i18n="btnPrintPDF">พิมพ์ใบงาน (PDF)</span>
          </button>
          <button onclick="closeModals()" class="w-full sm:w-auto px-4 py-3 md:py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl text-center order-2 sm:order-1" data-i18n="btnCloseModal">
            ปิดหน้าต่าง
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- MODALS LOGIN/REGISTER -->
  <div id="modal-login" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-md space-y-4">
      <h3 class="text-xl font-bold text-slate-800">🔐 <span data-i18n="modalLoginTitle">เข้าสู่ระบบ Admin</span></h3>
      <div><label class="block text-xs font-medium text-slate-600 mb-1" data-i18n="lblUserEmail">Username / อีเมล</label><input type="text" id="login-user" class="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500"></div>
      <div><label class="block text-xs font-medium text-slate-600 mb-1" data-i18n="lblPass">Password</label><input type="password" id="login-pass" class="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500"></div>
      <div class="flex flex-col sm:flex-row justify-end gap-2 pt-4 border-t border-slate-100">
        <button onclick="handleLogin()" class="w-full sm:w-auto px-6 py-3 text-sm font-bold bg-amber-400 text-slate-900 rounded-xl shadow order-1 sm:order-2" data-i18n="btnLoginConfirm">เข้าสู่ระบบ</button>
        <button onclick="closeModals()" class="w-full sm:w-auto px-5 py-3 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl order-2 sm:order-1" data-i18n="btnCancelModal">ยกเลิก</button>
      </div>
    </div>
  </div>

  <div id="modal-register" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">

      <h3 class="text-xl font-bold text-slate-800 pb-2 border-b border-slate-100">📝 <span data-i18n="modalRegTitle">ลงทะเบียนบัญชี Admin</span></h3>
      <div class="grid grid-cols-2 gap-3 pt-2">
        <div><label class="block text-xs font-medium text-slate-600 mb-1" data-i18n="lblEmpId">รหัสพนักงาน *</label><input type="text" id="reg-emp-id" placeholder="EMP-001" class="w-full p-3 border rounded-xl text-sm"></div>

      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-xs font-medium text-slate-600 mb-1" data-i18n="lblNickname">ชื่อเล่น *</label><input type="text" id="reg-nickname" placeholder="ช่างชัย" class="w-full p-3 border rounded-xl text-sm"></div>
        <div>

          <select id="reg-dept" class="w-full p-3 border rounded-xl text-sm bg-slate-50">
            <option value="IT" data-i18n="optIT">💻 ฝ่ายไอที (IT)</option>
            <option value="AV" data-i18n="optAV">🔊 โสตทัศนูปกรณ์ (AV)</option>
            <option value="MEDIA" data-i18n="optMEDIA">📷 ช่างภาพ/สื่อ (Media)</option>
            <option value="FACILITY" data-i18n="optFACILITY">🏢 อาคารสถานที่</option>
          </select>
        </div>
      </div>
      <div><label class="block text-xs font-medium text-slate-600 mb-1" data-i18n="lblSchoolEmail">อีเมลโรงเรียน (สำหรับ Mention) *</label><input type="email" id="reg-email" placeholder="vichai@denla.ac.th" class="w-full p-3 border rounded-xl text-sm"></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-xs font-medium text-slate-600 mb-1" data-i18n="lblUser">Username *</label><input type="text" id="reg-user" placeholder="admin_vichai" class="w-full p-3 border rounded-xl text-sm"></div>
        <div><label class="block text-xs font-medium text-slate-600 mb-1" data-i18n="lblPass">Password *</label><input type="password" id="reg-pass" placeholder="••••••••" class="w-full p-3 border rounded-xl text-sm"></div>
      </div>
      <div><label class="block text-xs font-bold text-indigo-700 mb-1" data-i18n="lblMasterKey">🔑 Master Key *</label><input type="password" id="reg-master-key" placeholder="DENLA2026" class="w-full p-3 border border-indigo-200 bg-indigo-50 rounded-xl text-sm"></div>
      <div class="flex flex-col sm:flex-row justify-end gap-2 pt-4 border-t border-slate-100">
        <button onclick="handleRegister()" class="w-full sm:w-auto px-6 py-3 text-sm font-bold bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow order-1 sm:order-2" data-i18n="btnRegConfirm">ยืนยันสมัคร Admin</button>
        <button onclick="closeModals()" class="w-full sm:w-auto px-5 py-3 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl order-2 sm:order-1" data-i18n="btnCancelModal">ยกเลิก</button>
      </div>
    </div>
